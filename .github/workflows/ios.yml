name: FocusSignal iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focussignal-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show selected toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate project and property lists
        run: bash Scripts/check-project.sh
      - name: Test core package
        run: swift test
      - name: Build app and extensions and run UI tests
        run: bash Scripts/test-ui.sh
